<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student Exam Performance Indicator</title>
</head>
<body>
  <h1>Student Exam Performance Indicator</h1>

  <form action="{{ url_for('predict_datapoint') }}" method="post">
    <!-- CSRF token if you’re using Flask-WTF -->
    {% if form.csrf_token %}{{ form.csrf_token }}{% endif %}

    <fieldset>
      <legend>Enter Student Details</legend>

      <p>
        <label for="gender">Gender</label><br>
        <select name="gender" id="gender" required>
          <option value="" disabled selected>Select your gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </p>

      <p>
        <label for="ethnicity">Race or Ethnicity</label><br>
        <select name="ethnicity" id="ethnicity" required>
          <option value="" disabled selected>Select ethnicity</option>
          <option value="group A">Group A</option>
          <option value="group B">Group B</option>
          <option value="group C">Group C</option>
          <option value="group D">Group D</option>
          <option value="group E">Group E</option>
        </select>
      </p>

      <p>
        <label for="parental_level_of_education">Parental Level of Education</label><br>
        <select name="parental_level_of_education" id="parental_level_of_education" required>
          <option value="" disabled selected>Select parental education</option>
          <option value="associate's degree">Associate’s degree</option>
          <option value="bachelor's degree">Bachelor’s degree</option>
          <option value="high school">High school</option>
          <option value="master's degree">Master’s degree</option>
          <option value="some college">Some college</option>
          <option value="some high school">Some high school</option>
        </select>
      </p>

      <p>
        <label for="lunch">Lunch Type</label><br>
        <select name="lunch" id="lunch" required>
          <option value="" disabled selected>Select lunch type</option>
          <option value="free/reduced">Free/reduced</option>
          <option value="standard">Standard</option>
        </select>
      </p>

      <p>
        <label for="test_preparation_course">Test Preparation Course</label><br>
        <select name="test_preparation_course" id="test_preparation_course" required>
          <option value="" disabled selected>Select test course</option>
          <option value="none">None</option>
          <option value="completed">Completed</option>
        </select>
      </p>

      <p>
        <label for="reading_score">Reading Score (0–100)</label><br>
        <input
          type="number"
          id="reading_score"
          name="reading_score"
          placeholder="Enter reading score"
          min="0"
          max="100"
          required>
      </p>

      <p>
        <label for="writing_score">Writing Score (0–100)</label><br>
        <input
          type="number"
          id="writing_score"
          name="writing_score"
          placeholder="Enter writing score"
          min="0"
          max="100"
          required>
      </p>

      <p>
        <button type="submit">Predict Maths Score</button>
      </p>
    </fieldset>
  </form>

  {% if results is defined %}
    <h2>Prediction: {{ results }}</h2>
  {% endif %}
</body>
</html>
